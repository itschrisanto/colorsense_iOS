name: ColorSense
options:
  bundleIdPrefix: online.colorsense
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  ClerkSDK:
    url: https://github.com/clerk/clerk-ios
    from: 1.2.0

targets:
  ColorSense:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColorSense
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: ClerkSDK
        product: ClerkKit
      - package: ClerkSDK
        product: ClerkKitUI
    info:
      path: Generated/ColorSense-Info.plist
      properties:
        CFBundleDisplayName: ColorSense
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # No camera or photo-library usage strings: the app has no camera code, and PhotosPicker
        # runs out of process so it needs no library permission. Add them back only alongside
        # code that actually requires them — unused permission strings invite review questions.
        CLERK_PUBLISHABLE_KEY: "$(CLERK_PUBLISHABLE_KEY)"
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.colorsense.ios
        TARGETED_DEVICE_FAMILY: "1"
        # Device builds need a real signing team; the simulator signs locally and ignores this.
        # Sourced from Secrets.xcconfig (gitignored) so a team ID is never committed and so
        # `xcodegen generate` doesn't wipe what you set in Xcode's Signing tab.
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO

  ColorSenseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColorSenseTests
    dependencies:
      - target: ColorSense
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ColorSense:
    build:
      targets:
        ColorSense: all
        ColorSenseTests: [test]
    test:
      targets:
        - ColorSenseTests
    run:
      config: Debug
