name: ColorSense
options:
  bundleIdPrefix: online.colorsense
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"

packages:
  ClerkSDK:
    url: https://github.com/clerk/clerk-ios
    from: 1.2.0

targets:
  ColorSense:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColorSense
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: ClerkSDK
        product: ClerkKit
      - package: ClerkSDK
        product: ClerkKitUI
    info:
      path: Generated/ColorSense-Info.plist
      properties:
        CFBundleDisplayName: ColorSense
        UILaunchScreen: {}
        # Portrait only. The palette screen is full-bleed bands splitting the available height,
        # and a band cannot be shorter than the 44pt tap targets it carries. Eight bands therefore
        # need 352pt, against the 288pt landscape leaves once the dock takes its safe-area inset
        # on an iPhone 17 Pro Max — so at seven or more colors the stack overflowed, clipping the
        # first name off the top of the screen and pushing the last band under the dock. That is
        # arithmetic, not a tuning problem: no type size fixes it while the tap targets stay legal.
        # Landscape did work at six colors or fewer, which is why it looked fine in testing.
        # Revisit only alongside a real landscape layout for these bands.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Wired to the build settings below rather than left to XcodeGen's defaults. With
        # GENERATE_INFOPLIST_FILE: NO, Xcode never injects MARKETING_VERSION or
        # CURRENT_PROJECT_VERSION itself, so without these two lines the generated plist
        # hardcoded 1.0/1 and both settings were dead config — bumping the version in this file
        # changed nothing in the built app, and a second upload would have been rejected for
        # reusing build number 1. App Store Connect requires a unique CFBundleVersion per upload.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # Required for the share sheet's "Save Image" action. That activity writes to the photo
        # library on the *host app's* behalf, so iOS silently omits it unless the app declares
        # this — even though the app never calls PHPhotoLibrary itself. Removing this once made
        # Share as image offer only "Save to Files"; the image-only actions (Assign to Contact,
        # Create Watch Face) still appeared, which made the cause easy to misread as a UTType
        # problem. Do not remove it while the export offers image sharing.
        NSPhotoLibraryAddUsageDescription: "ColorSense needs permission to save exported palettes to your photo library."
        # Required by the Extractor's camera source. iOS terminates the app outright if a camera
        # is opened without this, so it is not optional once CameraPicker exists.
        NSCameraUsageDescription: "ColorSense uses the camera so you can photograph something and pull a palette from its colors."
        # Read access, for the picker's own grid of recent photos. This was deliberately absent
        # while PhotosPicker was the only way in — it runs out of process, so the system hands
        # back one chosen image and the app never sees the library. Showing the camera inside the
        # grid is what changed that: PHPickerViewController cannot host a camera cell, so the
        # grid has to be ours, and a grid we draw is a library we read. The denied state still
        # falls back to PhotosPicker, so refusing this permission costs the grid, not the feature.
        NSPhotoLibraryUsageDescription: "ColorSense shows your recent photos so you can pick one and pull a palette from its colors. Photos are read on your device and never uploaded."
        CLERK_PUBLISHABLE_KEY: "$(CLERK_PUBLISHABLE_KEY)"
        # AppConfig reads all three of these from the Info.plist, but only the publishable key was
        # ever declared here — so setting API_BASE_URL or CLERK_PROXY_URL in Secrets.xcconfig did
        # nothing at all, despite AppConfig and CLAUDE.md both documenting them as overrides.
        # Neither default was affected (both are hardcoded fallbacks), so this never broke
        # production; it broke pointing the app at a local api-server, and pointing it at a dead
        # host to exercise the offline paths. AppConfig already guards against the unexpanded
        # "$(API_BASE_URL)" literal, which is what an undefined xcconfig variable expands to —
        # that guard only makes sense if these keys were meant to be here.
        API_BASE_URL: "$(API_BASE_URL)"
        CLERK_PROXY_URL: "$(CLERK_PROXY_URL)"
        # OAuth callback scheme. Clerk's iOS SDK defaults its redirect to
        # "<bundle id>://callback", so the app has to own that scheme or the browser has
        # nothing to hand the result back to. The same URL must also be listed as an
        # authorized redirect URI on the Clerk instance.
        CFBundleURLTypes:
          - CFBundleURLName: online.colorsense.ios
            CFBundleURLSchemes:
              - online.colorsense.ios
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.colorsense.ios
        TARGETED_DEVICE_FAMILY: "1"
        # Device builds need a real signing team; the simulator signs locally and ignores this.
        # Sourced from Secrets.xcconfig (gitignored) so a team ID is never committed and so
        # `xcodegen generate` doesn't wipe what you set in Xcode's Signing tab.
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
      # Personal Teams cannot provision Sign in with Apple. Keep day-to-day device builds
      # working with the current Personal Team; Release retains the entitlement for a paid
      # Apple Developer team and App Store distribution.
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/ColorSense.entitlements

  ColorSenseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColorSenseTests
    dependencies:
      - target: ColorSense
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ColorSense:
    build:
      targets:
        ColorSense: all
        ColorSenseTests: [test]
    test:
      targets:
        - ColorSenseTests
    run:
      config: Debug
